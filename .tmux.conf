# Set prefix to ctrl+x
set -g prefix C-x
unbind C-b

# Eliminate delay after Escape (default 500ms)
set -s escape-time 0

# Terminal capabilities
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB"

# Enable mouse
set -g mouse on

# Pass focus events to applications (enables vim FocusGained/FocusLost)
set -g focus-events on

# Scrollback history
set -g history-limit 50000

# Keep status messages on screen slightly longer (default ~750ms)
set -g display-time 1000

# Next/previous window with shift+left/right
bind -n S-Left previous-window
bind -n S-Right next-window

# Swap with next/previous window with ctrl+shift+left/right
bind-key -n C-S-Left swap-window -t -1\; previous-window
bind-key -n C-S-Right swap-window -t +1\; next-window

# Disable automatic renaming
set -g automatic-rename off

# Renumber windows on close so there are no gaps
set -g renumber-windows on

# Vim mode
set-window-option -g mode-keys vi

# Start selection
bind-key -Tcopy-mode-vi v send-keys -X begin-selection
# Cancel copy with escape
bind-key -Tcopy-mode-vi Escape send-keys -X cancel
# Toggle between block/visual selection
bind-key -Tcopy-mode-vi C-v send-keys -X rectangle-toggle
# Copy to system keyboard on enter
bind-key -Tcopy-mode-vi Enter send-keys -X copy-selection-and-cancel\; run "tmux save - | pbcopy"

# Let programs set the system clipboard via OSC 52 (ghostty supports it)
set -g set-clipboard on

# Unset left/right status
set -g status-right ""
set -g status-left ""

# Inactive window format
set -g window-status-format " #{?#{==:#{@claude_status},working},#[bg=white]#[fg=black] W #[bg=default]#[fg=default],}#{?#{==:#{@claude_status},stopped},#[bg=red]#[fg=white] S #[bg=default]#[fg=default],} #W (#I)#{?window_zoomed_flag,#[fg=red] [Z]#[fg=default],} "
# Active window format
set -g window-status-current-format "#[fg=green]#[bg=black] #{?#{==:#{@claude_status},working},#[bg=white]#[fg=black] W #[fg=green]#[bg=black],}#{?#{==:#{@claude_status},stopped},#[bg=red]#[fg=white] S #[fg=green]#[bg=black],} #W (#I)#{?window_zoomed_flag,#[fg=yellow] [Z]#[fg=green],} #[default]"

# Pane border titles
set -g pane-border-status top
set -g pane-border-format " #{?pane_active,#[fg=green],#[fg=dim]}#{?#{==:#{@claude_pane},working},#[bg=white]#[fg=black] W #[bg=default]#[fg=default],}#{?#{==:#{@claude_pane},stopped},#[bg=red]#[fg=white] S #[bg=default]#[fg=default],} #{?pane_active,#[fg=green],#[fg=dim]}#{pane_current_command} - #{b:pane_current_path}#[default] "

# Dim inactive pane borders, highlight the active one
set -g pane-border-style fg=colour240
set -g pane-active-border-style fg=green

# Color the active pane's full border, not just half the divider in 2-pane windows
set -g pane-border-indicators off

# New windows/splits start at root
bind c new-window -c "~"
bind '"' split-window -c "~"
bind % split-window -h -c "~"

# Repeatable pane resizing (prefix then H/J/K/L, hold for more)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Floating scratch shell at the current path
bind g display-popup -E -d "#{pane_current_path}" -w 80% -h 80%

# Reload config
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"
